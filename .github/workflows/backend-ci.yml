name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'training/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'training/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest backend/tests/ -v
