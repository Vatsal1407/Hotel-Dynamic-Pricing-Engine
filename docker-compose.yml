services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:localdev@db:5432/postgres
      CORS_ORIGINS: "http://localhost:5173"
      MODEL_ARTIFACT_PATH: /app/artifacts
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
